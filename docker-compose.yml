# RADAR has no database of its own — its tables live inside WatchTower's own Postgres instance
# (the "radar" schema), so there is no local `postgres` service here. Point DATABASE_URL in
# .env at that real instance (see .env.example). RADAR runs as one process (one uvicorn
# worker): see src/config/settings.py.
services:
  radar:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
